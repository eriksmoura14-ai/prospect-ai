name: Germany catalog regressions
on:
  pull_request:
    paths:
      - 'discovery/catalog-archive.cjs'
      - 'discovery/geometry-archive.cjs'
      - 'scripts/catalog-read.py'
      - 'scripts/catalog-germany*'
      - 'test/catalog_germany_test.py'
      - 'test/catalog_reader_test.py'
      - 'test/catalog-archive.test.cjs'
      - 'test/catalog-geometry.test.cjs'
      - 'test/fixtures/de-cochem-scope.json.gz'
      - 'tools/catalog-germany/**'
      - '.github/workflows/germany-discovery-regression.yml'
permissions:
  contents: read
jobs:
  finite-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r tools/catalog-germany/requirements.txt
      - run: node --test test/catalog-archive.test.cjs test/catalog-geometry.test.cjs
      - run: python -m unittest discover -s test -p 'catalog_germany_test.py'
      - run: python -m unittest discover -s test -p 'catalog_reader_test.py'
      - run: python -m unittest discover -s test -p 'catalog_world_ingest_test.py'
