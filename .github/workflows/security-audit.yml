name: Authentication security regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: prospect_audit
          POSTGRES_PASSWORD: disposable-local-fixture-only
          POSTGRES_DB: prospect_audit_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U prospect_audit -d prospect_audit_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r tools/security-audit/requirements.txt
      - name: Application regressions with PostgreSQL
        env:
          # Disposable CI service only; never use repository or production secrets.
          TEST_DATABASE_URL: postgresql://prospect_audit:disposable-local-fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/prospect_audit_ci
        run: npm test
      - name: Audit controls and real cookie authentication
        env:
          TEST_DATABASE_URL: postgresql://prospect_audit:disposable-local-fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/prospect_audit_ci
        run: npm run audit:auth
      - name: Confirm the public frontend still builds
        run: npm run build:frontend
